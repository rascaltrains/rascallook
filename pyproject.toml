[project]
name = "littlerascal"
version = "0.1.0"
description = "Endor Labs POC - sample Python project with known vulnerable dependencies"
requires-python = ">=3.10"
dependencies = [
    # Fix: bump to 2.3.2+ (same major, minor bump)
    "flask==2.3.1",         # CVE-2023-30861 - session cookie not set to Secure, fix in 2.3.2

    # Fix: bump to 2.31.0+ (same major, minor bump)
    "requests==2.30.0",     # CVE-2023-32681 - Proxy-Authorization header leak, fix in 2.31.0

    # Fix: bump to 41.0.0+ (same major-ish, one version bump)
    "cryptography==40.0.2", # CVE-2023-38325 - PKCS7 cert parsing, fix in 41.0.0

    # Fix: bump to 2.3.4+ (patch bump)
    "werkzeug==2.3.3",      # CVE-2023-46136 - DoS via multipart boundary, fix in 2.3.4

    # Fix: bump to 1.26.18+ (patch bump)
    "urllib3==1.26.17",     # CVE-2023-45803 - request body not stripped on redirect, fix in 1.26.18

    # Fix: bump to 3.1.3+ (patch bump)
    "jinja2==3.1.2",        # CVE-2024-22195 - XSS via xmlattr filter, fix in 3.1.3
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

